<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Prompt Post</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container" style="max-width: 1000px;">
        <h2 style="color: var(--primary-blue);">Admin Dashboard</h2>
        
        <div style="display: flex; justify-content: space-between; margin-bottom: 20px;">
            <p>จำนวนผู้ตอบแบบสอบถามทั้งหมด: <span id="totalCount" style="font-weight: bold; color: var(--primary-red);">0</span> คน</p>
            <div>
                <button class="btn-secondary" onclick="window.location.href='index.html'">กลับไปหน้าแรก</button>
                <button class="btn-red" onclick="clearData()">🗑️ ลบข้อมูลทั้งหมด</button>
            </div>
        </div>

        <div style="overflow-x: auto;">
            <table id="dataTable">
                <thead>
                    <tr>
                        <th>วัน-เวลา</th>
                        <th>อายุ</th>
                        <th>สถานภาพ</th>
                        <th>รูปแบบที่พัก</th>
                        <th>Feedback</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- ข้อมูลจะถูกเติมด้วย Javascript -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // โหลดข้อมูลเมื่อเปิดหน้า
        function loadData() {
            const data = JSON.parse(localStorage.getItem('surveyData')) || [];
            document.getElementById('totalCount').innerText = data.length;
            
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            data.forEach(row => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${row.timestamp || '-'}</td>
                    <td>${row.q1_1 || '-'}</td>
                    <td>${row.q1_2 || '-'}</td>
                    <td>${row.q1_3 || '-'}</td>
                    <td>${row.feedback || '-'}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // ฟังก์ชันลบข้อมูลทั้งหมด
        function clearData() {
            if(confirm("⚠️ คำเตือน: คุณแน่ใจหรือไม่ว่าต้องการลบข้อมูลทั้งหมด?\nการกระทำนี้ไม่สามารถกู้คืนได้ (เหมาะสำหรับลบข้อมูลที่ทดลองกรอกเอง)")) {
                localStorage.removeItem('surveyData');
                loadData(); // รีเฟรชตาราง
                alert("✅ ลบข้อมูลสำเร็จ");
            }
        }
บ
        // เรียกใช้งานตอนโหลดหน้า
        window.onload = loadData;
    </script>
</body>
</html>
